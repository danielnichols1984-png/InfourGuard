<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected accounts</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/site.css">
</head>
<body>
<nav class="site-nav">
    <a href="/dashboard" class="brand"><span class="brand-mark"></span>Connected accounts</a>
    <div class="site-nav-links"><a href="/dashboard" class="btn btn-secondary">Home</a></div>
</nav>
<div class="container" style="padding-top: 24px; padding-bottom: 64px; max-width: 640px;">
    <div id="error"></div>

    <div class="card">
        <div class="card-title">Google Drive</div>
        <div id="google-status">Loading&hellip;</div>
    </div>
    <div class="card">
        <div class="card-title">Dropbox</div>
        <div id="dropbox-status">Loading&hellip;</div>
    </div>
    <div class="card">
        <div class="card-title">Microsoft OneDrive</div>
        <div id="microsoft-status">Loading&hellip;</div>
    </div>

    <script>
        const REPORT_LINKS = {
            google: "/google/report",
            dropbox: "/dropbox/report",
            microsoft: "/microsoft/report",
        };

        function showError(msg) {
            document.getElementById("error").innerHTML = msg ? `<div class="alert alert-error">${msg}</div>` : "";
        }

        function renderProvider(provider, connected) {
            const statusDiv = document.getElementById(`${provider}-status`);
            const reportLink = REPORT_LINKS[provider];
            statusDiv.innerHTML = connected
                ? `<a href="${reportLink}" class="btn btn-primary">View report</a> <button class="btn btn-secondary" onclick="disconnect('${provider}')">Disconnect</button>`
                : `<a href="/connect/${provider}" class="btn btn-primary">Connect</a>`;
        }

        async function loadStatus() {
            showError("");
            const res = await fetch("/connect/status");
            if (!res.ok) {
                showError("Couldn't load integration status.");
                return;
            }
            const statuses = await res.json();
            const byProvider = Object.fromEntries(statuses.map((s) => [s.provider, s.connected]));
            renderProvider("google", byProvider.google);
            renderProvider("dropbox", byProvider.dropbox);
            renderProvider("microsoft", byProvider.microsoft);
        }

        async function disconnect(provider) {
            showError("");
            const res = await fetch(`/connect/${provider}/disconnect`, { method: "POST" });
            if (!res.ok) {
                showError(`Couldn't disconnect ${provider}.`);
                return;
            }
            loadStatus();
        }

        loadStatus();
    </script>
</div>
<script src="/static/js/impersonation-banner.js"></script>
</body>
</html>
