<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin: Individual Users</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/site.css">
    <style>
        #users-table td button { margin: 2px; }
        .new-user-form { display: flex; gap: 10px; flex-wrap: wrap; }
        .new-user-form input { width: auto; flex: 1; min-width: 180px; }
    </style>
</head>
<body>
<nav class="site-nav">
    <a href="/dashboard" class="brand"><span class="brand-mark"></span>Admin</a>
    <div class="site-nav-links"><a href="/dashboard" class="btn btn-secondary">Home</a></div>
</nav>
<div class="container" style="padding-top: 24px; padding-bottom: 64px;">
    <div class="tab-nav">
        <a href="/admin/plans" class="tab-link">Plans</a>
        <a href="/admin/users" class="tab-link active">Individual Users</a>
        <a href="/admin/businesses" class="tab-link">Business Accounts</a>
    </div>
    <div id="error"></div>

    <div class="card">
        <div class="card-title">Users</div>
        <div class="table-responsive">
            <table id="users-table">
                <thead>
                    <tr><th>ID</th><th>Email</th><th>Admin</th><th></th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Create a user</div>
        <form id="new-user-form" class="new-user-form">
            <input type="email" name="email" placeholder="email@example.com" required>
            <input type="password" name="password" placeholder="Temporary password" required>
            <button type="submit" class="btn btn-primary">Create user</button>
        </form>
    </div>
</div>

    <script>
        let me = null;

        function showError(msg) {
            document.getElementById("error").innerHTML = msg ? `<div class="alert alert-error">${msg}</div>` : "";
        }

        async function api(path, options) {
            const res = await fetch(path, {
                headers: { "Content-Type": "application/json" },
                ...options,
            });
            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                throw new Error(data.detail || `Request failed (${res.status})`);
            }
            return res.status === 204 ? null : res.json();
        }

        async function loadUsers() {
            me = await api("/auth/me");
            const users = await api("/auth/admin/users");
            const tbody = document.querySelector("#users-table tbody");
            tbody.innerHTML = "";
            users.forEach((u) => {
                const isSelf = u.id === me.id;
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${u.id}</td>
                    <td>${u.email}</td>
                    <td>${u.is_admin ? "Yes" : "No"}</td>
                    <td>
                        ${!u.is_admin ? `<button class="btn btn-secondary" data-view-as="${u.id}">View as</button>` : ""}
                        ${!isSelf ? `<button class="btn btn-secondary" data-toggle-admin="${u.id}" data-current="${u.is_admin}">${u.is_admin ? "Remove admin" : "Make admin"}</button>` : ""}
                        ${!isSelf && !u.is_admin ? `<button class="btn btn-danger" data-delete="${u.id}">Delete</button>` : ""}
                        ${isSelf || !u.is_admin ? `<button class="btn btn-secondary" data-reset-password="${u.id}">Reset password</button>` : ""}
                        ${!u.is_admin ? `<button class="btn btn-secondary" data-email-google="${u.id}">Email Google report</button>` : ""}
                        ${!u.is_admin ? `<button class="btn btn-secondary" data-email-dropbox="${u.id}">Email Dropbox report</button>` : ""}
                        ${!u.is_admin ? `<button class="btn btn-secondary" data-email-microsoft="${u.id}">Email OneDrive report</button>` : ""}
                    </td>
                `;
                const viewAsBtn = tr.querySelector("[data-view-as]");
                if (viewAsBtn) viewAsBtn.onclick = () => viewAs(u.id);
                const toggleBtn = tr.querySelector("[data-toggle-admin]");
                if (toggleBtn) toggleBtn.onclick = () => toggleAdmin(u.id, u.is_admin);
                const deleteBtn = tr.querySelector("[data-delete]");
                if (deleteBtn) deleteBtn.onclick = () => deleteUser(u.id);
                const resetBtn = tr.querySelector("[data-reset-password]");
                if (resetBtn) resetBtn.onclick = () => resetPassword(u.id, u.email);
                const emailGoogleBtn = tr.querySelector("[data-email-google]");
                if (emailGoogleBtn) emailGoogleBtn.onclick = () => emailReport(u.id, "google", u.email);
                const emailDropboxBtn = tr.querySelector("[data-email-dropbox]");
                if (emailDropboxBtn) emailDropboxBtn.onclick = () => emailReport(u.id, "dropbox", u.email);
                const emailMicrosoftBtn = tr.querySelector("[data-email-microsoft]");
                if (emailMicrosoftBtn) emailMicrosoftBtn.onclick = () => emailReport(u.id, "microsoft", u.email);
                tbody.appendChild(tr);
            });
        }

        async function viewAs(userId) {
            showError("");
            try {
                await api(`/auth/admin/users/${userId}/impersonate`, { method: "POST" });
                window.location.href = "/dashboard";
            } catch (e) {
                showError(e.message);
            }
        }

        async function toggleAdmin(userId, currentlyAdmin) {
            showError("");
            try {
                await api(`/auth/admin/users/${userId}/admin-status?is_admin=${!currentlyAdmin}`, {
                    method: "PUT",
                });
                await loadUsers();
            } catch (e) {
                showError(e.message);
            }
        }

        async function deleteUser(userId) {
            if (!confirm(`Delete user #${userId}? This can't be undone.`)) return;
            showError("");
            try {
                await api(`/auth/admin/users/${userId}`, { method: "DELETE" });
                await loadUsers();
            } catch (e) {
                showError(e.message);
            }
        }

        async function resetPassword(userId, email) {
            const newPassword = prompt(`New password for ${email}:`);
            if (!newPassword) return;
            showError("");
            try {
                await api(`/auth/admin/users/${userId}/password`, {
                    method: "PUT",
                    body: JSON.stringify({ new_password: newPassword }),
                });
                alert("Password updated.");
            } catch (e) {
                showError(e.message);
            }
        }

        async function emailReport(userId, provider, defaultEmail) {
            const email = prompt(`Send this user's ${provider} report to:`, defaultEmail);
            if (!email) return;
            showError("");
            try {
                const result = await api(`/connect/admin/users/${userId}/${provider}/report/email`, {
                    method: "POST",
                    body: JSON.stringify({ email }),
                });
                alert(result.sent ? "Report sent." : "Couldn't send — check email settings.");
            } catch (e) {
                showError(e.message);
            }
        }

        document.getElementById("new-user-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            showError("");
            const form = new FormData(e.target);
            try {
                await api("/auth/admin/users", {
                    method: "POST",
                    body: JSON.stringify({
                        email: form.get("email"),
                        password: form.get("password"),
                    }),
                });
                e.target.reset();
                await loadUsers();
            } catch (err) {
                showError(err.message);
            }
        });

        loadUsers();
    </script>
    <script src="/static/js/impersonation-banner.js"></script>
</body>
</html>
