<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Business</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/site.css">
    <style>
        #members-table td, #members-table th { white-space: nowrap; }
        #members-table td button { margin-right: 4px; }
        .new-member-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
        .new-member-form input { width: auto; flex: 1; min-width: 180px; }
    </style>
</head>
<body>
<nav class="site-nav">
    <a href="/dashboard" class="brand"><span class="brand-mark"></span><span id="business-name">My Business</span></a>
    <div class="site-nav-links"><a href="/dashboard" class="btn btn-secondary">Home</a></div>
</nav>
<div class="container" style="padding-top: 24px; padding-bottom: 64px;">
    <div id="error"></div>

    <div class="card">
        <div class="card-title">Members</div>
        <div class="table-responsive">
            <table id="members-table">
                <thead>
                    <tr><th>Email</th><th>Role</th><th></th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="admin-tools" class="card" style="display:none;">
        <div class="card-title">Add a member</div>
        <form id="new-member-form" class="new-member-form">
            <input type="email" name="email" placeholder="email@example.com" required>
            <input type="password" name="password" placeholder="Temporary password" required>
            <button type="submit" class="btn btn-primary">Add member</button>
        </form>
    </div>
</div>

    <script>
        let me = null;
        let isBusinessAdmin = false;

        function showError(msg) {
            document.getElementById("error").innerHTML = msg ? `<div class="alert alert-error">${msg}</div>` : "";
        }

        async function api(path, options) {
            const res = await fetch(path, {
                headers: { "Content-Type": "application/json" },
                ...options,
            });
            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                throw new Error(data.detail || `Request failed (${res.status})`);
            }
            return res.status === 204 ? null : res.json();
        }

        async function load() {
            me = await api("/auth/me");
            const business = await api("/businesses/my-business");
            document.getElementById("business-name").textContent = business.name;

            const myMembership = business.members.find((m) => m.user_id === me.id);
            isBusinessAdmin = myMembership && myMembership.role === "business_admin";
            document.getElementById("admin-tools").style.display = isBusinessAdmin ? "block" : "none";

            const tbody = document.querySelector("#members-table tbody");
            tbody.innerHTML = "";
            business.members.forEach((m) => {
                const isSelf = m.user_id === me.id;
                const tr = document.createElement("tr");
                const otherRole = m.role === "business_admin" ? "member" : "business_admin";
                const actions = isBusinessAdmin && !isSelf
                    ? `
                        <button data-role="${m.user_id}" data-new-role="${otherRole}">Make ${otherRole === "business_admin" ? "admin" : "member"}</button>
                        <button data-view-as="${m.user_id}">View as</button>
                        <button data-reset="${m.user_id}">Reset password</button>
                        <button data-email-google="${m.user_id}">Email Google report</button>
                        <button data-email-dropbox="${m.user_id}">Email Dropbox report</button>
                        <button data-email-microsoft="${m.user_id}">Email OneDrive report</button>
                        <button data-remove="${m.user_id}">Remove</button>
                    `
                    : isBusinessAdmin && isSelf && m.role === "business_admin"
                    ? `<button data-role="${m.user_id}" data-new-role="member">Step down as admin</button>`
                    : "";
                tr.innerHTML = `<td>${m.email}</td><td>${m.role}</td><td>${actions}</td>`;
                const roleBtn = tr.querySelector("[data-role]");
                if (roleBtn) {
                    roleBtn.onclick = () => setRole(m.user_id, roleBtn.dataset.newRole);
                }
                if (isBusinessAdmin && !isSelf) {
                    tr.querySelector("[data-view-as]").onclick = () => viewAs(m.user_id);
                    tr.querySelector("[data-reset]").onclick = () => resetPassword(m.user_id, m.email);
                    tr.querySelector("[data-email-google]").onclick = () => emailReport(m.user_id, "google", m.email);
                    tr.querySelector("[data-email-dropbox]").onclick = () => emailReport(m.user_id, "dropbox", m.email);
                    tr.querySelector("[data-email-microsoft]").onclick = () => emailReport(m.user_id, "microsoft", m.email);
                    tr.querySelector("[data-remove]").onclick = () => removeMember(m.user_id);
                }
                tbody.appendChild(tr);
            });
        }

        async function viewAs(userId) {
            showError("");
            try {
                await api(`/businesses/my-business/members/${userId}/impersonate`, { method: "POST" });
                window.location.href = "/dashboard";
            } catch (e) {
                showError(e.message);
            }
        }

        async function resetPassword(userId, email) {
            const newPassword = prompt(`New password for ${email}:`);
            if (!newPassword) return;
            showError("");
            try {
                await api(`/businesses/my-business/members/${userId}/password`, {
                    method: "PUT",
                    body: JSON.stringify({ new_password: newPassword }),
                });
                alert("Password updated.");
            } catch (e) {
                showError(e.message);
            }
        }

        async function emailReport(userId, provider, defaultEmail) {
            const email = prompt(`Send this member's ${provider} report to:`, defaultEmail);
            if (!email) return;
            showError("");
            try {
                const result = await api(`/businesses/my-business/members/${userId}/reports/${provider}/email`, {
                    method: "POST",
                    body: JSON.stringify({ email }),
                });
                alert(result.sent ? "Report sent." : "Couldn't send — check email settings.");
            } catch (e) {
                showError(e.message);
            }
        }

        async function setRole(userId, newRole) {
            showError("");
            try {
                await api(`/businesses/my-business/members/${userId}/role`, {
                    method: "PUT",
                    body: JSON.stringify({ role: newRole }),
                });
                await load();
            } catch (e) {
                showError(e.message);
            }
        }

        async function removeMember(userId) {
            if (!confirm("Remove this member from the business?")) return;
            showError("");
            try {
                await api(`/businesses/my-business/members/${userId}`, { method: "DELETE" });
                await load();
            } catch (e) {
                showError(e.message);
            }
        }

        document.getElementById("new-member-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            showError("");
            const form = new FormData(e.target);
            try {
                await api("/businesses/my-business/members", {
                    method: "POST",
                    body: JSON.stringify({
                        email: form.get("email"),
                        password: form.get("password"),
                    }),
                });
                e.target.reset();
                await load();
            } catch (err) {
                showError(err.message);
            }
        });

        load();
    </script>
    <script src="/static/js/impersonation-banner.js"></script>
</body>
</html>
