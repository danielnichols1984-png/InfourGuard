<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/site.css">
    <style>
        .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .auth-card { width: 100%; max-width: 380px; }
        .auth-card .brand { justify-content: center; margin-bottom: 24px; }
        .auth-card h1 { font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 24px; }
        .auth-card form > * + * { margin-top: 14px; }
        .auth-card .btn { width: 100%; margin-top: 6px; }
        .auth-footer { text-align: center; margin-top: 18px; font-size: 14px; color: var(--ink-600); }
    </style>
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <a href="/" class="brand"><span class="brand-mark"></span>Cloudscope</a>
        <div class="card">
            <h1>Log in</h1>
            {% if error %}<div class="alert alert-error">Invalid email or password. Please try again.</div>{% endif %}
            <form action="/auth/login" method="post">
                <div>
                    <label class="field-label" for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label class="field-label" for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Log in</button>
            </form>
        </div>
        <p class="auth-footer">Don't have an account? <a href="/signup" style="color: var(--primary); font-weight: 600;">Sign up</a></p>
    </div>
</div>
</body>
</html>
