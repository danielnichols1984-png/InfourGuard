<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ status_code }} — Error</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/site.css">
    <style>
        .error-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
        .error-wrap h1 { font-size: 72px; font-weight: 800; color: var(--danger); margin-bottom: 8px; }
        .error-wrap p { font-size: 16px; color: var(--ink-600); margin-bottom: 24px; }
    </style>
</head>
<body>
    <div class="error-wrap">
        <div>
            <h1>{{ status_code }}</h1>
            <p>{{ detail }}</p>
            <a href="/dashboard" class="btn btn-primary">Back to dashboard</a>
        </div>
    </div>
</body>
</html>
