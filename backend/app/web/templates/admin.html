<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin: Plans</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/site.css">
    <style>
        #plans-table input[type="text"], #plans-table input:not([type]) { min-width: 90px; }
        .new-plan-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .new-plan-form input { width: auto; flex: 1; min-width: 140px; }
        .new-plan-form label { font-size: 13px; color: var(--ink-700); white-space: nowrap; }
    </style>
</head>
<body>
<nav class="site-nav">
    <a href="/dashboard" class="brand"><span class="brand-mark"></span>Admin</a>
    <div class="site-nav-links"><a href="/dashboard" class="btn btn-secondary">Home</a></div>
</nav>
<div class="container" style="padding-top: 24px; padding-bottom: 64px;">
    <div class="tab-nav">
        <a href="/admin/plans" class="tab-link active">Plans</a>
        <a href="/admin/users" class="tab-link">Individual Users</a>
        <a href="/admin/businesses" class="tab-link">Business Accounts</a>
    </div>
    <div id="error"></div>

    <div class="card">
        <div class="card-title">Plans</div>
        <div class="table-responsive">
            <table id="plans-table">
                <thead>
                    <tr><th>Name</th><th>Display name</th><th>Price</th><th>Features</th><th>Default</th><th>Business</th><th></th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <p style="color: var(--ink-500); font-size: 13px; margin-top: 10px;">Edit any field, then click Save on that row.</p>
    </div>

    <div class="card">
        <div class="card-title">Add a plan</div>
        <form id="new-plan-form" class="new-plan-form">
            <input name="name" placeholder="name (e.g. enterprise)" required>
            <input name="display_name" placeholder="Display name" required>
            <input name="price_display" placeholder="Price (e.g. $99/mo)" required>
            <input name="features" placeholder="Features, comma separated">
            <label><input type="checkbox" name="is_default"> Default plan</label>
            <label><input type="checkbox" name="is_business_plan"> Business plan</label>
            <button type="submit" class="btn btn-primary">Create plan</button>
        </form>
    </div>

    <div class="card">
        <div class="card-title">Users</div>
        <div class="table-responsive">
            <table id="users-table">
                <thead><tr><th>Email</th><th>Plan</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Pending payments</div>
        <div class="table-responsive">
            <table id="payments-table">
                <thead>
                    <tr><th>Email</th><th>Plan</th><th>Method</th><th>Billing name</th><th>Submitted</th><th></th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

    <script>
        let plans = [];

        function showError(msg) {
            document.getElementById("error").innerHTML = msg ? `<div class="alert alert-error">${msg}</div>` : "";
        }

        function featuresToList(text) {
            return text.split(",").map((f) => f.trim()).filter(Boolean);
        }

        async function loadPlans() {
            const res = await fetch("/subscriptions/plans");
            plans = await res.json();
            const tbody = document.querySelector("#plans-table tbody");
            tbody.innerHTML = "";
            plans.forEach((plan) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${plan.name}</td>
                    <td><input data-field="display_name" value="${plan.display_name}"></td>
                    <td><input data-field="price_display" value="${plan.price_display}"></td>
                    <td><input data-field="features" value="${plan.features.join(", ")}" size="30"></td>
                    <td><input type="checkbox" data-field="is_default" ${plan.is_default ? "checked" : ""}></td>
                    <td><input type="checkbox" data-field="is_business_plan" ${plan.is_business_plan ? "checked" : ""}></td>
                    <td>
                        <button class="btn btn-primary" data-save="${plan.id}">Save</button>
                        <button class="btn btn-danger" data-delete="${plan.id}">Delete</button>
                    </td>
                `;
                tr.querySelector("[data-save]").onclick = () => savePlan(plan.id, tr);
                tr.querySelector("[data-delete]").onclick = () => deletePlan(plan.id);
                tbody.appendChild(tr);
            });
        }

        async function loadUsers() {
            const res = await fetch("/subscriptions/admin/users");
            if (!res.ok) {
                showError("Couldn't load users (are you an admin?).");
                return;
            }
            const users = await res.json();
            const tbody = document.querySelector("#users-table tbody");
            tbody.innerHTML = "";
            users.forEach((u) => {
                const tr = document.createElement("tr");
                const options = plans
                    .map(
                        (p) =>
                            `<option value="${p.id}" ${p.id === u.plan.id ? "selected" : ""}>${p.display_name}</option>`
                    )
                    .join("");
                tr.innerHTML = `<td>${u.email}</td><td><select>${options}</select></td>`;
                tr.querySelector("select").onchange = (e) =>
                    setUserPlan(u.user_id, Number(e.target.value));
                tbody.appendChild(tr);
            });
        }

        async function createPlan(e) {
            e.preventDefault();
            showError("");
            const form = e.target;
            const body = {
                name: form.name.value,
                display_name: form.display_name.value,
                price_display: form.price_display.value,
                features: featuresToList(form.features.value),
                is_default: form.is_default.checked,
                is_business_plan: form.is_business_plan.checked,
            };
            const res = await fetch("/subscriptions/admin/plans", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });
            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                showError(data.detail || "Couldn't create plan.");
                return;
            }
            form.reset();
            await loadPlans();
            await loadUsers();
        }

        async function savePlan(planId, tr) {
            showError("");
            const body = {
                display_name: tr.querySelector('[data-field="display_name"]').value,
                price_display: tr.querySelector('[data-field="price_display"]').value,
                features: featuresToList(tr.querySelector('[data-field="features"]').value),
                is_default: tr.querySelector('[data-field="is_default"]').checked,
                is_business_plan: tr.querySelector('[data-field="is_business_plan"]').checked,
            };
            const res = await fetch(`/subscriptions/admin/plans/${planId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });
            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                showError(data.detail || "Couldn't save plan.");
                return;
            }
            await loadPlans();
            await loadUsers();
        }

        async function deletePlan(planId) {
            showError("");
            const res = await fetch(`/subscriptions/admin/plans/${planId}`, { method: "DELETE" });
            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                showError(data.detail || "Couldn't delete plan.");
                return;
            }
            await loadPlans();
            await loadUsers();
        }

        async function loadPayments() {
            const res = await fetch("/subscriptions/admin/payments?status=pending");
            if (!res.ok) return;
            const payments = await res.json();
            const tbody = document.querySelector("#payments-table tbody");
            tbody.innerHTML = "";
            payments.forEach((p) => {
                const tr = document.createElement("tr");
                const submitted = p.created_at ? new Date(p.created_at).toLocaleString() : "-";
                tr.innerHTML = `
                    <td>${p.email}</td>
                    <td>${p.plan.display_name}</td>
                    <td>${p.method}</td>
                    <td>${p.billing_name}</td>
                    <td>${submitted}</td>
                    <td>
                        <button class="btn btn-primary" data-confirm="${p.id}">Confirm</button>
                        <button class="btn btn-danger" data-reject="${p.id}">Reject</button>
                    </td>
                `;
                tr.querySelector("[data-confirm]").onclick = () => resolvePayment(p.id, "confirm");
                tr.querySelector("[data-reject]").onclick = () => resolvePayment(p.id, "reject");
                tbody.appendChild(tr);
            });
        }

        async function resolvePayment(paymentId, action) {
            showError("");
            const res = await fetch(`/subscriptions/admin/payments/${paymentId}/${action}`, { method: "POST" });
            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                showError(data.detail || `Couldn't ${action} payment.`);
                return;
            }
            await loadPayments();
            await loadUsers();
        }

        async function setUserPlan(userId, planId) {
            showError("");
            const res = await fetch(`/subscriptions/admin/users/${userId}/plan`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ plan_id: planId }),
            });
            if (!res.ok) {
                showError("Couldn't update that user's plan.");
                return;
            }
            await loadUsers();
        }

        document.getElementById("new-plan-form").addEventListener("submit", createPlan);

        (async () => {
            await loadPlans();
            await loadUsers();
            await loadPayments();
        })();
    </script>
    <script src="/static/js/impersonation-banner.js"></script>
</body>
</html>
